name: Build Executable (Windows)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "DBZ_Story_Editor" "DBZ_STORY_EDITOR_DLC EDITION.py"

      - name: Compress Build Output
        run: |
          powershell Compress-Archive -Path "dist/DBZ_Story_Editor" -DestinationPath "DBZ_Story_Editor_Windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBZ-Story-Editor-Executable
          path: DBZ_Story_Editor_Windows.zip
