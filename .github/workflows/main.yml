name: Compilar a EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Compilar ejecutable único (.EXE)
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon="BT3_no_green.ico" --name "DBZ_STORY_EDITOR_DLC_EDITION" "DBZ_STORY_EDITOR_DLC_EDITION.py"

      - name: Subir ejecutable a GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: DBZ_STORY_EDITOR_DLC_EDITION
          path: dist/DBZ_STORY_EDITOR_DLC_EDITION.exe

      - name: Crear Release en GitHub (cuando usas Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/DBZ_STORY_EDITOR_DLC_EDITION.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
