name: Compilar a EXE

on:
  push:
    tags:
      - 'v*' # Se activa al publicar una etiqueta de versión (ej: v1.0, v1.0.0)
  workflow_dispatch: # Permite compilar manualmente desde la pestaña Actions en GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Compilar ejecutable único (.EXE)
        run: |
          pyinstaller --noconsole --onefile --name "BT3_Story_Mode_Editor" main.py

      - name: Subir artefacto (para descargas manuales)
        uses: actions/upload-artifact@v4
        with:
          name: BT3_Story_Mode_Editor_Windows
          path: dist/BT3_Story_Mode_Editor.exe

      - name: Crear Release en GitHub (cuando usas Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/BT3_Story_Mode_Editor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
