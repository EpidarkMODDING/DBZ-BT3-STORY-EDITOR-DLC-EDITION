name: Compilar Executable (.EXE)

on:
  push:
    tags:
      - 'v*' # Se activa cuando creas un tag de versión, por ejemplo: v1.0.0
  workflow_dispatch: # Permite ejecutar el proceso manualmente desde GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "BT3_Story_Mode_Editor" main.py

      - name: Subir el ejecutable a GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/BT3_Story_Mode_Editor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
